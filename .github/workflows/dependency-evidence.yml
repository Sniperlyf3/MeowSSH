name: Dependency Evidence

on:
  pull_request:
    paths:
      - ".github/workflows/dependency-evidence.yml"
      - "scripts/generate-dependency-inventory.sh"
      - "scripts/validate-dependency-inventory.sh"
      - "scripts/test-validate-dependency-inventory.sh"
      - "MeowSSH.slnx"
      - "Directory.Build.props"
      - "**/*.csproj"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Test dependency evidence validator
        shell: bash
        run: bash scripts/test-validate-dependency-inventory.sh

      - name: Install the Android workload
        run: dotnet workload install maui-android

      - name: Generate dependency evidence
        shell: bash
        run: bash scripts/generate-dependency-inventory.sh

      - name: Validate evidence
        shell: bash
        run: bash scripts/validate-dependency-inventory.sh artifacts/dependency-inventory "${{ github.sha }}"

      - name: Upload dependency evidence
        uses: actions/upload-artifact@v7
        with:
          name: dependency-evidence-${{ github.sha }}
          path: artifacts/dependency-inventory/
          if-no-files-found: error
          retention-days: 30
