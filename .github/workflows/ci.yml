name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/MeowSSH.Core.Tests --no-build --configuration Release --logger "trx;LogFileName=core.trx"

      # Against a real OpenSSH server over a real socket. Nothing else catches a
      # wrong signature byte, a mis-negotiated terminal mode, or a host key
      # policy that trusts more than it should.
      - name: Install OpenSSH server
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: SSH engine integration tests
        run: sudo -E env "PATH=$PATH" dotnet test tests/MeowSSH.Integration.Tests --no-build --configuration Release --logger "trx;LogFileName=integration.trx"

      # The UI is Razor components in a WebView, so the same components that ship
      # to Android run in a browser. That is what lets the interaction tests run
      # here at all -- no emulator, no device farm.
      - name: Install Playwright browsers
        run: pwsh tests/MeowSSH.UI.Tests/bin/Release/net10.0/playwright.ps1 install chromium --with-deps

      - name: UI end-to-end tests
        run: dotnet test tests/MeowSSH.UI.Tests --no-build --configuration Release --logger "trx;LogFileName=ui.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # The installable artifact. Kept separate from build-and-test because it needs
  # the Android workload and SDK, which cost several minutes the test jobs should
  # not pay for.
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Android workload
        run: dotnet workload install maui-android

      - name: Build the APK
        # Debug rather than Release: a debug build is signed with the SDK's own
        # debug key, so it can be sideloaded. A release build would need a
        # keystore, which belongs in repository secrets rather than here.
        # arm64 only, which halves the download and covers every real phone.
        run: >
          dotnet publish src/MeowSSH.App/MeowSSH.App.csproj
          -c Debug -f net10.0-android36.0
          -p:RuntimeIdentifier=android-arm64

      - name: Check the native binaries survived packaging
        # AndroidExtractNativeLibraries is what lets these be executed at all, and
        # a packaging change that dropped them would otherwise only show up as a
        # connection that fails on a device.
        run: |
          APK=$(find src/MeowSSH.App/bin -name "*-Signed.apk" | head -1)
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmeowshell.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libtailcat.so"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: meowssh-apk
          # The publish directory only, not bin/**: the same APK exists in both,
          # and the glob was uploading it twice.
          path: src/MeowSSH.App/bin/Debug/net10.0-android36.0/android-arm64/publish/*-Signed.apk
          if-no-files-found: error

  # The layer Playwright cannot reach: a real Keystore, a real filesystem, real
  # API-level guards. Everything above it is proven on Linux in seconds; this
  # job exists for the handful of claims that have no desktop equivalent and
  # were previously only ever checked by installing the APK and looking.
  device-tests:
    runs-on: ubuntu-latest
    # An emulator boot plus the run; well clear of both, so a genuine hang is
    # still reported as a failure rather than running until the job limit.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Android workload
        run: dotnet workload install maui-android

      # The runner has KVM but does not expose it to the user by default, and
      # without it the emulator falls back to software rendering and times out.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the device test APK
        run: >
          dotnet build tests/MeowSSH.Device.Tests/MeowSSH.Device.Tests.csproj
          -c Debug -f net10.0-android36.0

      - name: Run the device tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          # 34 rather than 36: the API the app targets is not the one it must
          # run on, and 34 has a stable system image with a working Keystore.
          api-level: 34
          target: google_apis
          arch: x86_64
          # A snapshot would carry Keystore state between runs, and these tests
          # assert on what a key store does when a key is absent.
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          # Runs under dash, not bash: no pipefail, no bashisms. "set -eu" is
          # portable and is what stops a failed install from being followed by a
          # confusing instrumentation error.
          script: |
            set -eu

            APK=$(find tests/MeowSSH.Device.Tests/bin -name "*.devicetests-Signed.apk" | head -1)
            if [ -z "$APK" ]; then
              echo "no device test APK was built"
              exit 1
            fi
            echo "installing $APK"
            adb install -r "$APK"

            # -w blocks until the instrumentation calls Finish. Its own exit
            # status is 0 whatever the tests did, so the report it prints is the
            # source of truth and is what the job is gated on below.
            adb shell am instrument -w \
              dev.sniperlyf3.meowssh.devicetests/dev.sniperlyf3.meowssh.devicetests.TestInstrumentation \
              > instrumentation.txt 2>&1 || true

            cat instrumentation.txt

            if ! grep -q "device tests passed" instrumentation.txt; then
              echo "device tests did not report success"
              exit 1
            fi

      - name: Upload the device test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: device-test-report
          path: instrumentation.txt
          if-no-files-found: ignore
