name: CI

on:
  push:
    branches: ["**"]
  pull_request:

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/MeowSSH.Core.Tests --no-build --configuration Release --logger "trx;LogFileName=core.trx"

      # Against a real OpenSSH server over a real socket. Nothing else catches a
      # wrong signature byte, a mis-negotiated terminal mode, or a host key
      # policy that trusts more than it should.
      - name: Install OpenSSH server
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: SSH engine integration tests
        run: sudo -E env "PATH=$PATH" dotnet test tests/MeowSSH.Integration.Tests --no-build --configuration Release --logger "trx;LogFileName=integration.trx"

      # The UI is Razor components in a WebView, so the same components that ship
      # to Android run in a browser. That is what lets the interaction tests run
      # here at all -- no emulator, no device farm.
      - name: Install Playwright browsers
        run: pwsh tests/MeowSSH.UI.Tests/bin/Release/net10.0/playwright.ps1 install chromium --with-deps

      - name: UI end-to-end tests
        run: dotnet test tests/MeowSSH.UI.Tests --no-build --configuration Release --logger "trx;LogFileName=ui.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore
