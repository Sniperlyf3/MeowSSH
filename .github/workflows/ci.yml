name: CI

on:
  push:
    branches: ["claude/beautiful-bohr-im81me"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: 1
  DOTNET_CLI_TELEMETRY_OPTOUT: 1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/MeowSSH.Core.Tests --no-build --configuration Release --logger "trx;LogFileName=core.trx"

      # Against a real OpenSSH server over a real socket. Nothing else catches a
      # wrong signature byte, a mis-negotiated terminal mode, or a host key
      # policy that trusts more than it should.
      - name: Install OpenSSH server
        run: sudo apt-get update && sudo apt-get install -y openssh-server

      - name: SSH engine integration tests
        run: sudo -E env "PATH=$PATH" dotnet test tests/MeowSSH.Integration.Tests --no-build --configuration Release --logger "trx;LogFileName=integration.trx"

      # The UI is Razor components in a WebView, so the same components that ship
      # to Android run in a browser. That is what lets the interaction tests run
      # here at all -- no emulator, no device farm.
      - name: Install Playwright browsers
        run: pwsh tests/MeowSSH.UI.Tests/bin/Release/net10.0/playwright.ps1 install chromium --with-deps

      - name: UI end-to-end tests
        run: dotnet test tests/MeowSSH.UI.Tests --no-build --configuration Release --logger "trx;LogFileName=ui.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

  # Fast installable development artifact. Release hardening is validated in its
  # own job below so AOT does not slow every emulator/development path.
  android-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Android workload
        run: dotnet workload install maui-android

      - name: Build the APK
        # Every CI run gets a monotonically increasing Android versionCode so a
        # newer artifact can replace an older installed build. If the persistent
        # signing secrets are configured, the same certificate is also reused
        # across runners; without that Android may still require an uninstall.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
        run: |
          args=(
            dotnet publish src/MeowSSH.App/MeowSSH.App.csproj
            -c Debug -f net10.0-android36.0
            -p:RuntimeIdentifier=android-arm64
            -p:SourceRevisionId=${{ github.sha }}
            -p:Version=0.1.${{ github.run_number }}
            -p:ApplicationDisplayVersion=0.1.${{ github.run_number }}
            -p:ApplicationVersion=${{ github.run_number }}
          )

          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            KEYSTORE="$RUNNER_TEMP/meowssh-ci.keystore"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
            chmod 600 "$KEYSTORE"
            args+=(
              -p:AndroidKeyStore=true
              "-p:AndroidSigningKeyStore=$KEYSTORE"
              "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS"
              "-p:AndroidSigningKeyPass=$ANDROID_KEY_PASSWORD"
              "-p:AndroidSigningStorePass=$ANDROID_STORE_PASSWORD"
            )
          else
            echo "::warning::Persistent Android signing secrets are not configured; APK signatures may change between runners and require uninstall/reinstall."
          fi

          "${args[@]}"

      - name: Check the native binaries survived packaging
        run: |
          APK=$(find src/MeowSSH.App/bin -name "*-Signed.apk" | head -1)
          test -n "$APK"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmeowshell.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libtailcat.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libhev-socks5-tunnel.so"
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload the APK
        uses: actions/upload-artifact@v7
        with:
          name: meowssh-apk-${{ github.sha }}
          path: src/MeowSSH.App/bin/Debug/net10.0-android36.0/android-arm64/publish/*-Signed.apk
          if-no-files-found: error

  # This is the artifact configuration intended for distribution. It deliberately
  # pays the AOT/linker cost so CI catches reflection, Java-binding and native
  # packaging regressions before a paid build reaches Play Console.
  android-release-hardening:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Android workload
        run: dotnet workload install maui-android

      - name: Build AOT/full-linked Release APK
        run: >
          dotnet publish src/MeowSSH.App/MeowSSH.App.csproj
          -c Release -f net10.0-android36.0
          -p:RuntimeIdentifier=android-arm64
          -p:SourceRevisionId=${{ github.sha }}
          -p:Version=0.1.${{ github.run_number }}
          -p:ApplicationDisplayVersion=0.1.${{ github.run_number }}
          -p:ApplicationVersion=${{ github.run_number }}

      - name: Verify hardened Release package
        run: |
          APK=$(find src/MeowSSH.App/bin/Release -name "*-Signed.apk" | head -1)
          test -n "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libmeowshell.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libtailcat.so"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/libhev-socks5-tunnel.so"
          echo "Hardened Release APK: $APK ($(du -h "$APK" | cut -f1))"

      - name: Upload hardened Release APK
        uses: actions/upload-artifact@v7
        with:
          name: meowssh-release-apk-${{ github.sha }}
          path: src/MeowSSH.App/bin/Release/net10.0-android36.0/android-arm64/publish/*-Signed.apk
          if-no-files-found: error

  # The layer Playwright cannot reach: a real Keystore, a real filesystem, real
  # API-level guards. Everything above it is proven on Linux in seconds; this
  # job exists for the handful of claims that have no desktop equivalent and
  # were previously only ever checked by installing the APK and looking.
  device-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Install the Android workload
        run: dotnet workload install maui-android

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build the device test APK
        run: >
          dotnet build tests/MeowSSH.Device.Tests/MeowSSH.Device.Tests.csproj
          -c Debug -f net10.0-android36.0

      - name: Run the device tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: ./scripts/run-device-tests.sh

      - name: Upload the device test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: device-test-report
          path: instrumentation.txt
          if-no-files-found: ignore
